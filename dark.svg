<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-dark" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow-dark">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg-dark)"/>

  <!-- Decorative circles -->
  <circle cx="150" cy="80" r="60" fill="#00d9ff" opacity="0.12"/>
  <circle cx="1080" cy="350" r="80" fill="#a855f7" opacity="0.1"/>

  <!-- Profile card background -->
  <rect x="80" y="60" width="1040" height="300" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow-dark)"/>

  <!-- Profile picture container -->
  <circle cx="220" cy="210" r="95" fill="#1e293b" stroke="#00d9ff" stroke-width="3"/>
  <image href="https://raw.githubusercontent.com/muhittinefecan-turk/muhittinefecan-turk/main/pp.jpg" x="125" y="115" width="190" height="190" preserveAspectRatio="xMidYMid slice" clip-path="url(#circle-clip-dark)"/>
  
  <defs>
    <clipPath id="circle-clip-dark">
      <circle cx="220" cy="210" r="95"/>
    </clipPath>
  </defs>

  <!-- Text content -->
  <text x="360" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#f1f5f9">
    Muhittin Efecan Türk
  </text>

  <text x="360" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1">
    Full-Stack Developer · Designer · Creative Developer
  </text>

  <text x="360" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">
    Fikirleri kod, tasarım ve görsel anlatımla gerçeğe dönüştürüyorum.
  </text>

  <!-- Tech badges -->
  <g id="badges" x="360" y="290">
    <rect x="360" y="280" width="55" height="26" rx="13" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="387" y="300" font-family="monospace" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">React</text>

    <rect x="430" y="280" width="55" height="26" rx="13" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="457" y="300" font-family="monospace" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Node.js</text>

    <rect x="500" y="280" width="55" height="26" rx="13" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="527" y="300" font-family="monospace" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Three.js</text>

    <rect x="570" y="280" width="55" height="26" rx="13" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="597" y="300" font-family="monospace" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Figma</text>
  </g>
</svg>
